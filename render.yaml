# Render Blueprint: web service + Postgres + a cron job that drives the watch loop.
# Dashboard → New → Blueprint → pick this repo. See "Deploy on Render" in README.md.
# Every `sync: false` value is a secret or a per-deploy URL: Render asks for it when the Blueprint is first
# created, and it can be changed later under each service's Environment tab.

databases:
  - name: standing-orders-db
    plan: free
    postgresMajorVersion: "17"

services:
  # The Next.js app: UI, API routes, and POST /api/tick.
  - type: web
    name: standing-orders
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript and Tailwind, and db:migrate runs through tsx at start.
    buildCommand: npm install --include=dev && npm run build
    # Migrations are idempotent (schema_migrations), so they run before every start.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: standing-orders-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # https://api-m.sandbox.paypal.com for the sandbox.
      - key: PAYPAL_API_BASE
        sync: false
      # Id of the webhook registered for https://<host>/api/webhooks/paypal; deliveries are verified against it.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: DEMO_USER_ID
        sync: false
      # Leave empty to send every purchase through a one-tap approval link (tier 2).
      - key: AGENT_READY_MERCHANTS
        sync: false
      # Must match TICK_SECRET on the cron job below.
      - key: TICK_SECRET
        sync: false
      # Set both to this service's public URL after the first deploy: PayPal return links are built from them.
      - key: APP_BASE_URL
        sync: false
      - key: STORE_BASE_URL
        sync: false

  # What makes an order "standing": every 15 minutes this asks the web service to check every due order.
  # curl -f exits non-zero on any non-2xx answer (401 wrong secret, 503 missing keys, 5xx), so the run is
  # marked failed in the dashboard instead of passing silently.
  - type: cron
    name: standing-orders-tick
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: echo "nothing to build"
    startCommand: 'curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $TICK_SECRET" "$APP_URL/api/tick"'
    envVars:
      # The web service's public URL, no trailing slash, e.g. https://standing-orders.onrender.com
      - key: APP_URL
        sync: false
      # Must match TICK_SECRET on the web service.
      - key: TICK_SECRET
        sync: false
